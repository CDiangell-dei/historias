<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CDiangell • Crônicas de Re:Zero & Arquivo de Histórias</title>
  
  <meta name="description" content="Arquivo de histórias, fanfictions de Re:Zero (Reencontro, TFS-WTBO, Um Acordo Mútuo) e RPG por CDiangell. Com leitor temático e exportador para AO3." />
  <meta property="og:title" content="CDiangell • Crônicas de Re:Zero & Histórias" />
  <meta property="og:description" content="Leia as fanfictions de Re:Zero e sistemas de RPG de CDiangell com leitor temático e cópia instantânea para AO3." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#080c14" />

  <!-- Favicon: Pleiades Star in SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M12 2l2.4 6.9 7.1.3-5.5 4.5 1.9 7.1-5.9-4.1-5.9 4.1 1.9-7.1-5.5-4.5 7.1-.3z'/></svg>" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="recursos/app.css" />
</head>
<body class="theme-night font-md">
  <div class="stars-bg"></div>

  <!-- Mobile Drawer Backdrop Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-container">
    <!-- Topbar Navigation -->
    <header class="topbar">
      <!-- 1. Botão do Menu à Esquerda (Sempre visível no mobile) -->
      <button class="btn-icon sidebar-toggle" id="sidebarToggle" title="Abrir menu de histórias e capítulos">
        <span class="hamburger-icon">☰</span>
        <span class="sidebar-toggle-label">Menu</span>
      </button>

      <!-- 2. Logo Centralizado -->
      <div class="brand-section" id="btnBrandHome" title="Voltar ao início">
        <div class="brand-crest">✦</div>
        <div class="brand-info">
          <span class="brand-name">CDIANGELL</span>
          <span class="brand-subtitle">Crônicas de Re:Zero</span>
        </div>
      </div>

      <!-- 3. Controles à Direita -->
      <div class="topbar-controls">
        <button class="btn-icon desktop-only" id="fontDecBtn" title="Diminuir fonte">A-</button>
        <button class="btn-icon desktop-only" id="fontIncBtn" title="Aumentar fonte">A+</button>
        <button class="btn-icon" id="themeToggleBtn" title="Alternar tema visual">🌓</button>
        <a href="https://archiveofourown.org/users/CDiangell" target="_blank" rel="noopener noreferrer" class="ao3-badge-btn desktop-only" title="Ver perfil no AO3">
          <span>AO3</span>
        </a>
      </div>
    </header>

    <!-- Main Content Layout -->
    <div class="main-wrapper">
      <!-- Sidebar / Drawer -->
      <aside class="sidebar" id="sidebar">
        <!-- Topo da gaveta mobile com botão fechar -->
        <div class="sidebar-close-row">
          <span>✦ MENU DO ARQUIVO</span>
          <button class="sidebar-close-btn" id="sidebarCloseBtn" title="Fechar menu">✕</button>
        </div>

        <!-- Atalhos rápidos dentro da gaveta mobile -->
        <div class="sidebar-mobile-quick-actions">
          <a href="https://archiveofourown.org/users/CDiangell" target="_blank" rel="noopener noreferrer" class="sidebar-ao3-link">
            <span>🌐</span> Perfil no AO3 (CDiangell)
          </a>
          <div class="sidebar-font-row">
            <span style="font-size:0.8rem;color:var(--text-muted);">Tamanho da Letra:</span>
            <div style="display:flex;gap:0.4rem;">
              <button class="btn-icon" id="fontDecBtnMobile" style="height:32px;min-width:32px;">A-</button>
              <button class="btn-icon" id="fontIncBtnMobile" style="height:32px;min-width:32px;">A+</button>
            </div>
          </div>
        </div>

        <div id="chapterNavContainer">
          <!-- Populated dynamically by app.js -->
        </div>
      </aside>

      <!-- Central Content View -->
      <main class="content-area" id="mainContent">
        <!-- Rendered dynamically by app.js -->
      </main>
    </div>
  </div>

  <!-- Botão Flutuante de Capítulos para Celular (Polegar) -->
  <button class="floating-mobile-menu" id="floatingMenuBtn" title="Abrir menu de capítulos">
    <span>📚</span>
    <span>Capítulos</span>
  </button>

  <!-- Toast Notification Feedback -->
  <div class="toast-msg" id="toastMsg">
    <span>📋</span> Copiado para a área de transferência!
  </div>

  <!-- Scripts -->
  <script src="recursos/stories_data.js"></script>
  <script src="recursos/app.js"></script>
</body>
</html>
